name: Actualizar previsión y publicar

on:
  schedule:
    # Horas UTC. En horario de verano peninsular (UTC+2) son las 06:20,
    # 10:20, 14:20 y 19:20 hora local: antes de la sesión de mañana, a
    # media mañana, antes de la de tarde y de noche para el día siguiente.
    # El minuto 20 evita el pico de carga de las horas en punto.
    - cron: "20 4,8,12,17 * * *"
  workflow_dispatch:        # botón de "actualizar ahora"
  push:
    branches: [main]
    paths:
      - "config/**"         # tocar spots.yaml republica al momento
      - "site/**"
      - "scripts/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests de la lógica de veredicto
        run: python -m pytest -q

      - name: Verificar que las APIs siguen devolviendo lo esperado
        run: python scripts/verify_apis.py

      # Recuperamos el data.json ya publicado. Si hoy falla la construcción,
      # se vuelve a publicar el anterior: el sitio nunca se queda en blanco
      # y la interfaz enseña su antigüedad.
      - name: Recuperar los últimos datos publicados
        continue-on-error: true
        run: |
          curl -fsSL --retry 2 -o site/data.json \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" \
            && echo "recuperado el data.json anterior" \
            || echo "no hay data.json anterior (primer despliegue)"

      - name: Construir previsión
        id: construir
        run: python scripts/build_data.py

      - name: Comprobar que el JSON es publicable
        run: |
          python - <<'PY'
          import json, sys, datetime
          d = json.load(open("site/data.json", encoding="utf-8"))
          assert d["spots"], "sin spots"
          assert "PENDIENTE_ROBE" not in json.dumps(d), "marcadores internos filtrados"
          for s in d["spots"]:
              assert s["dias"], f"{s['id']} sin días"
              for x in s["dias"]:
                  assert x["titular"].strip(), f"{s['id']} {x['fecha']} sin porqué"
          edad = datetime.datetime.now(datetime.timezone.utc) - \
                 datetime.datetime.fromisoformat(d["generado"]).astimezone(datetime.timezone.utc)
          print(f"{len(d['spots'])} spots · generado hace {edad.total_seconds()/60:.0f} min")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
