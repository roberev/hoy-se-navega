        origen: verificado
      ventana:
        tipo: PENDIENTE_ROBE
        nota_para_robe: >-
          Playa muy tendida: con marea baja el agua se retira mucho.
          ¿Cuánta marea necesitas para no tener que andar 300 m?

    viento:
      orientacion_costa_grados: 215
      origen_orientacion: geometria
      direcciones:
        buenas: [[150, 270]]
        regulares: [[120, 150], [270, 310]]
        malas: [[310, 360], [0, 120]]
        origen: geometria

    mar:
      ola_max_m: PENDIENTE_ROBE

    nivel_recomendado: PENDIENTE_ROBE

    logistica:
      aparcamiento: PENDIENTE_ROBE
      acceso_al_agua: PENDIENTE_ROBE

    seguridad:
      - aviso: >-
          Marismas de Valdelagrana: espacio protegido dentro del Parque
          Natural Bahía de Cádiz.
        origen: verificado
        severidad: media
      - aviso: >-
          Cercanía al canal de entrada del puerto de El Puerto de Santa
          María y a la bocana del Guadalete: tráfico de embarcaciones.
        origen: verificado
        severidad: media

  # ---------------------------------------------------------------------------
  - id: puerto-real
    nombre: Puerto Real (Río San Pedro)
    zona: Bahía interior
    orden: 5

    coordenadas:
      lat: 36.5322
      lon: -6.2131
      origen: verificado
      nota: Referencia zona Río San Pedro / La Cachucha.

    marea:
      estacion_ihm:
        id: 43
        nombre: La Carraca
        origen: verificado
        nota: >-
          Puerto Real no tiene estación propia en el IHM. Se usa La Carraca,
          la más cercana dentro de la bahía interior. La bahía interior tiene
          desfase de marea respecto a la bocana; si notas que no cuadra,
          díselo y lo ajustamos con un desfase fijo.
      ventana:
        tipo: PENDIENTE_ROBE
        nota_para_robe: >-
          Bahía interior muy somera. Con bajamar viva probablemente sea
          fango. ¿Es navegable sólo en pleamar?

    viento:
      orientacion_costa_grados: 250
      origen_orientacion: geometria
      direcciones:
        buenas: [[180, 300]]
        regulares: [[150, 180], [300, 340]]
        malas: [[340, 360], [0, 150]]
        origen: geometria
        nota_para_robe: >-
          Bahía interior rodeada de tierra: aquí la dirección importa menos
          por el oleaje y más por si el viento entra limpio o racheado.

    mar:
      ola_max_m: PENDIENTE_ROBE

    nivel_recomendado: PENDIENTE_ROBE

    logistica:
      aparcamiento: PENDIENTE_ROBE
      acceso_al_agua: PENDIENTE_ROBE

    seguridad:
      - aviso: >-
          Parque Natural Bahía de Cádiz: fondos fangosos, esteros y caños.
        origen: verificado
        severidad: media
      - aviso: PENDIENTE_ROBE

