    marea:
      estacion_ihm:
        id: 45
        nombre: Sancti Petri
        origen: verificado
      ventana:
        tipo: PENDIENTE_ROBE

    viento:
      orientacion_costa_grados: 235
      origen_orientacion: geometria
      direcciones:
        buenas: [[170, 290]]
        regulares: [[140, 170], [290, 320]]
