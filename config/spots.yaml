      direcciones:
        buenas: [[170, 290]]
        regulares: [[140, 170], [290, 320]]
        malas: [[320, 360], [0, 140]]
        origen: geometria

    mar:
      ola_max_m: PENDIENTE_ROBE

    nivel_recomendado: PENDIENTE_ROBE

    logistica:
      aparcamiento: PENDIENTE_ROBE
      acceso_al_agua: PENDIENTE_ROBE

    seguridad:
      - aviso: >-
          Playa dentro del Parque Natural Bahía de Cádiz, con accesos
          regulados y aparcamiento limitado en verano.
        origen: verificado
        severidad: media
      - aviso: PENDIENTE_ROBE

