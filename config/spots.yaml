    marea:
      estacion_ihm:
        id: 42
        nombre: Cádiz
        origen: verificado
      ventana:
        tipo: PENDIENTE_ROBE

    viento:
      orientacion_costa_grados: 235
      origen_orientacion: geometria
      direcciones:
        buenas: [[170, 290]]
        regulares: [[140, 170], [290, 320]]
        malas: [[320, 360], [0, 140]]
        origen: geometria
        nota_para_robe: >-
          Aquí el Levante es offshore y, según cuentan, entra muy racheado
          por la ciudad en La Victoria y más limpio en Cortadura.
          Confírmalo o córrígelo tú.

    mar:
      ola_max_m: PENDIENTE_ROBE

    nivel_recomendado: PENDIENTE_ROBE

    logistica:
      aparcamiento: PENDIENTE_ROBE
      acceso_al_agua: PENDIENTE_ROBE

    seguridad:
